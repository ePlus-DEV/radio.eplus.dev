<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#101119">
  <title>Offline | ePlus OnAir</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); background: radial-gradient(ellipse at 50% 5%, #381724 0%, #101119 54%); color: #f9fafb; }
    main { max-width: 430px; width: 100%; text-align: center; padding: 32px 24px; border: 1px solid #39333c; border-radius: 24px; background: #1b1b23; box-shadow: 0 20px 70px #0004; }
    .brand { margin: 0 0 28px; color: #fb7185; font-weight: 800; letter-spacing: -.02em; font-size: 20px; }
    .icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px; background: #fb71851a; color: #fda4af; }
    h1 { font-size: clamp(23px, 5.5vw, 29px); margin: 0 0 12px; letter-spacing: -.035em; }
    p { color: #c7c7d0; line-height: 1.65; margin: 0 0 26px; }
    button { appearance: none; border: 0; border-radius: 13px; background: #e11d48; color: white; font: inherit; font-weight: 650; padding: 13px 25px; min-height: 48px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fda4af; outline-offset: 4px; }
    button:hover { background: #be123c; }
    .connection-state { display: block; min-height: 20px; margin-top: 14px; color: #fda4af; font-size: 13px; }
    .note { display: block; margin-top: 12px; color: #aaaab6; font-size: 12px; }
    button:disabled { cursor: progress; opacity: .75; }
    @media (prefers-reduced-motion: no-preference) { button { transition: background .15s ease; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">ePlus OnAir</div>
    <div class="icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a5 5 0 0 0 0 6M8 6a9 9 0 0 0 0 12M12 3a13 13 0 0 0 0 18"/><path d="M16 9v6m3-8v10"/></svg>
    </div>
    <h1 id="offline-title">You're offline</h1>
    <p id="offline-description">Live radio needs an internet connection. Reconnect to keep listening.</p>
    <button type="button" id="retry">Try again</button>
    <span class="connection-state" id="connection-state" role="status" aria-live="polite">Waiting for a connection…</span>
    <small class="note" id="offline-note">Live stations cannot play offline.</small>
  </main>
  <script>
    (() => {
      const messages = {
        en: ["You're offline", "Live radio needs an internet connection. Reconnect to keep listening.", "Try again", "Live stations cannot play offline.", "Waiting for a connection…", "Checking connection…", "Connection restored. Reopening radio…"],
        vi: ["Bạn đang ngoại tuyến", "Radio trực tiếp cần kết nối Internet. Hãy kết nối lại để tiếp tục nghe.", "Thử lại", "Không thể nghe đài trực tiếp khi ngoại tuyến.", "Đang chờ kết nối mạng…", "Đang kiểm tra kết nối…", "Đã có mạng. Đang mở lại radio…"],
        ja: ["オフラインです", "ライブ配信のラジオにはインターネット接続が必要です。再接続してください。", "再試行", "オフラインではライブ放送を再生できません。", "接続を待っています…", "接続を確認しています…", "接続が回復しました。ラジオを開き直します…"],
        "zh-CN": ["当前处于离线状态", "收听直播电台需要网络连接。请重新连接后继续收听。", "重试", "离线时无法播放直播电台。", "正在等待网络连接…", "正在检查网络连接…", "连接已恢复，正在重新打开电台…"],
        "zh-TW": ["目前處於離線狀態", "收聽直播電台需要網路連線。請重新連線後繼續收聽。", "重試", "離線時無法播放直播電台。", "正在等待網路連線…", "正在檢查網路連線…", "連線已恢復，正在重新開啟電台…"],
        fr: ["Vous êtes hors ligne", "Une connexion Internet est nécessaire pour écouter la radio en direct. Reconnectez-vous pour continuer.", "Réessayer", "Les radios en direct ne fonctionnent pas hors ligne.", "En attente de connexion…", "Vérification de la connexion…", "Connexion rétablie. Réouverture de la radio…"],
        ru: ["Вы не в сети", "Для прямого эфира радио требуется интернет. Подключитесь к сети, чтобы продолжить.", "Повторить", "Прямой эфир недоступен без интернета.", "Ожидание подключения…", "Проверка соединения…", "Соединение восстановлено. Открываем радио…"],
      };
      const browserLanguage = (navigator.language || 'en').toLowerCase();
      const language = browserLanguage.startsWith('zh-tw') || browserLanguage.startsWith('zh-hk') || browserLanguage.startsWith('zh-mo')
        ? 'zh-TW' : browserLanguage.startsWith('zh') ? 'zh-CN'
        : browserLanguage.startsWith('vi') ? 'vi' : browserLanguage.startsWith('ja') ? 'ja'
        : browserLanguage.startsWith('fr') ? 'fr' : browserLanguage.startsWith('ru') ? 'ru' : 'en';
      document.documentElement.lang = language;
      const [title, description, retry, note, waiting, checking, connected] = messages[language];
      document.getElementById('offline-title').textContent = title;
      document.getElementById('offline-description').textContent = description;
      document.getElementById('offline-note').textContent = note;

      const retryButton = document.getElementById('retry');
      const connectionState = document.getElementById('connection-state');
      retryButton.textContent = retry;
      connectionState.textContent = waiting;

      let retryTimer = null;
      let checkingConnection = false;
      let pendingCheck = false;
      let restored = false;
      let failedAttempts = 0;

      const scheduleRetry = () => {
        clearTimeout(retryTimer);
        if (restored || document.hidden) return;
        // Back off while the connection is unavailable; never reload in a loop.
        const delay = Math.min(15_000, 3_000 * 2 ** Math.min(Math.max(0, failedAttempts - 1), 3));
        retryTimer = setTimeout(() => { void checkConnection(); }, delay);
      };

      async function checkConnection() {
        if (restored || document.hidden) return;
        if (checkingConnection) {
          pendingCheck = true;
          return;
        }
        checkingConnection = true;
        clearTimeout(retryTimer);
        retryButton.disabled = true;
        connectionState.textContent = checking;

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5_000);
        try {
          // The active worker gives us the correct deployment scope for deep
          // links and /pr-preview/pr-N/ paths, not just the production root.
          let registration;
          try {
            registration = await navigator.serviceWorker?.getRegistration?.();
          } catch {
            // A blocked or unavailable service-worker API must not prevent
            // recovery when the website is already reachable again.
          }
          const previewPath = window.location.pathname.match(/^\/pr-preview\/pr-[1-9]\d*\//)?.[0];
          const fallbackScope = new URL(previewPath || '/', window.location.origin).href;
          const scope = registration?.scope || fallbackScope;
          // A non-navigation request bypasses our navigation-only offline
          // fallback. Require a real, valid manifest before reloading.
          const probeUrl = new URL('brand/site.webmanifest', scope);
          const response = await fetch(probeUrl.href, {
            cache: 'no-store',
            redirect: 'error',
            signal: controller.signal,
          });
          if (!response.ok) throw new Error('Connection unavailable');
          const manifest = await response.json();
          if (manifest?.name !== 'ePlus OnAir — Listen Beyond Borders.'
            || manifest?.start_url !== '../' || manifest?.scope !== '../') {
            throw new Error('Unexpected website manifest');
          }

          restored = true;
          connectionState.textContent = connected;
          // The address bar still contains the requested station/page URL.
          // Do not initiate playback; normal restore-on-reload rules apply.
          window.location.reload();
        } catch {
          failedAttempts += 1;
          connectionState.textContent = waiting;
        } finally {
          clearTimeout(timeout);
          checkingConnection = false;
          retryButton.disabled = false;
          if (!restored) {
            if (pendingCheck) {
              pendingCheck = false;
              void checkConnection();
            } else {
              scheduleRetry();
            }
          }
        }
      }

      retryButton.addEventListener('click', () => {
        failedAttempts = 0;
        void checkConnection();
      });
      window.addEventListener('online', () => {
        failedAttempts = 0;
        void checkConnection();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearTimeout(retryTimer);
          pendingCheck = false;
          return;
        }
        failedAttempts = 0;
        void checkConnection();
      });
      // Also recover when the network returns without firing an online event.
      void checkConnection();
    })();
  </script>
</body>
</html>
