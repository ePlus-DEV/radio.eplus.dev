version: "3.7"

services:
  nuxt-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuxt-app
    image: eplus-radio/nuxt-app
    restart: always
    ports:
      - "3000:3000"
    command: "npm run dev"
    networks:
      - nuxt-network
networks:
  nuxt-network:
    driver: bridge
