name: Notify app of web production update
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: notify-onair-app
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub App configuration
        env:
          APP_ID: ${{ vars.ONAIR_SYNC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ONAIR_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure the sync GitHub App ID and private key before enabling this workflow."
            exit 1
          fi
      - name: Create scoped installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ONAIR_SYNC_APP_ID }}
          private-key: ${{ secrets.ONAIR_SYNC_APP_PRIVATE_KEY }}
          owner: ePlus-DEV
          repositories: onair-apps
      - name: Dispatch web main update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WEB_SHA: ${{ github.sha }}
        run: |
          gh api --method POST repos/ePlus-DEV/onair-apps/dispatches \
            -f event_type=web-main-updated -f "client_payload[web_sha]=$WEB_SHA"
