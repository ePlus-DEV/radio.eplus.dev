name: "VOH missing radio discovery"
on:
  push:
    branches:
      - fix/voh-fm-956-stream-20261012
    paths:
      - ".github/workflows/voh-missing-radio-import.yml"
      - "scripts/sync-voh-radios.mjs"
      - "tests/voh-catalog-import.test.mjs"

permissions:
  contents: write

jobs:
  discover:
    name: "Audit VOH missing channels; append only verified streams"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/voh-fm-956-stream-20261012
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
      - name: "Test metadata extraction and deduplication"
        run: node --test tests/voh-catalog-import.test.mjs
      - name: "Fetch the eight missing channels and test HLS manifests"
        run: node scripts/sync-voh-radios.mjs --write
      - name: "Review actual changes and update this PR branch"
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/radio/asia/viet-nam.json public/img/asia/viet-nam/
          if git diff --cached --quiet; then
            echo "No verified and unique new streams found; nothing to commit."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "data(radio): import verified VOH-linked regional radio streams"
          git push origin "HEAD:fix/voh-fm-956-stream-20261012"
