name: Refresh dependency lockfile

on:
  push:
    branches:
      - chore/upgrade-nuxt3-dependencies
    paths:
      - package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/upgrade-nuxt3-dependencies

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "chore: refresh package lock"
          git push
