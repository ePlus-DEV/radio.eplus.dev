# TEMPORARY, branch-scoped lock regeneration. Remove after the generated lock is committed.
# Important: this only runs for the exact trusted branch in this repository.
name: "Security lockfile refresh (temporary)"
on:
  pull_request:
    types: [opened]
    branches: [develop]
    paths:
      - "package.json"
      - ".github/workflows/security-lock-refresh.yml"
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/remediate-i18n-redirects-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/remediate-i18n-redirects-20261102
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - name: Generate reproducible lockfile from npm registry without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Commit generated lockfile to the exact branch
        run: |
          set -euo pipefail
          git diff -- package-lock.json
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): regenerate npm lockfile from registry"
          git push origin HEAD:refs/heads/security/remediate-i18n-redirects-20261102
