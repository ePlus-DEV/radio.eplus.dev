name: "PR Preview — GitHub Pages"

# GitHub resolves pull_request_target workflow definitions from the DEFAULT branch.
# Keep this file on main, even though previews target PRs against staging.
# Untrusted PR code is built in a read-only job without deployment secrets.
on:
  pull_request_target:
    branches: [staging]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

env:
  # Development PR previews always publish to their own Pages repository.
  PREVIEW_TARGET_REPOSITORY: ePlus-DEV/onair-pr-previews
  PREVIEW_SITE_ORIGIN: https://preview.radio.eplus.dev
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:

  # A PR update invalidates any previous Preview link immediately.
  # This trusted metadata-only job never checks out PR code or loads deploy secrets.
  comment_status:
    name: "Hide Preview URL while building or after PR closure"
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'staging' &&
      !startsWith(github.event.pull_request.head.ref, 'bot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: onair-pr-preview-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Replace stale preview link with build/closed status
        shell: bash
        run: |
          set -euo pipefail
          read -r state base head repo < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .base.ref, .head.sha, .head.repo.full_name] | @tsv')
          if [ "$base" != staging ] || [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::Not an eligible same-repository PR; skip comment."
            exit 0
          fi
          if [ "$EVENT_ACTION" = closed ]; then
            if [ "$state" != closed ]; then
              echo "::notice::PR reopened; ignore stale closed event."
              exit 0
            fi
            status="🗃️ **Preview expired.** This PR is closed; the Preview link is hidden."
          else
            if [ "$state" != open ] || [ "$head" != "$EXPECTED_HEAD" ]; then
              echo "::notice::PR head changed; do not overwrite a newer Preview status."
              exit 0
            fi
            status="⏳ **Building preview…** The link will appear only after this commit is live and verified."
          fi

          body="$(printf '<!-- onair-pr-preview -->\n<!-- onair-preview-head:%s -->\n<!-- onair-preview-run:%s -->\n### ePlus OnAir — PR Preview\n\n%s\n\n[View build status](https://github.com/%s/actions/runs/%s)\n\nPreview is noindex; the full catalog is available on Staging after merge.\n' "$EXPECTED_HEAD" "$GITHUB_RUN_ID" "$status" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          marker_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select((.body // "") | contains("<!-- onair-pr-preview -->")) | .id' | head -n 1)"
          if [ -n "$marker_id" ]; then
            jq -n --arg body "$body" '{body:$body}' | gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$marker_id" --input - >/dev/null
          elif [ "$EVENT_ACTION" != closed ]; then
            jq -n --arg body "$body" '{body:$body}' | gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input - >/dev/null
          fi

  # This trusted job uses the Preview Environment, but NEVER checks out or
  # executes PR code. It forwards ONLY explicitly named public vars via outputs.
  # The next job remains isolated from all Preview Environment secrets.
  preview_config:
    name: "Read preview public config (trusted, no checkout)"
    if: >-
      (vars.PAGES_PREVIEW_READY == 'true' || (vars.PAGES_PREVIEW_READY == '' && vars.PAGES_DEV_READY == 'true')) &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'staging' &&
      !startsWith(github.event.pull_request.head.ref, 'bot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: ${{ vars.PAGES_PREVIEW_READY == 'true' && 'preview' || 'development' }}
    outputs:
      cors_server: ${{ steps.public.outputs.cors_server }}
      resolver_url: ${{ steps.public.outputs.resolver_url }}
      site_name: ${{ steps.public.outputs.site_name }}
    steps:
      - name: Export ONLY validated public variables to isolated preview
        id: public
        shell: bash
        env:
          CORS_SERVER: ${{ vars.NUXT_PUBLIC_CORS_SERVER_1 }}
          RESOLVER_URL: ${{ vars.NUXT_PUBLIC_GLOBAL_RADIO_RESOLVER_URL }}
          # Ignore the old development Environment's title during migration.
          PREVIEW_SITE_NAME: ${{ vars.PAGES_PREVIEW_READY == 'true' && vars.NUXT_PUBLIC_SITE_NAME || '' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = require('node:fs');

          function validatePublicUrl(value, kind) {
            if (!value) return '';
            if (value !== value.trim() || /[\r\n]/.test(value)) {
              throw new Error('Invalid ' + kind + ' public URL');
            }
            let url;
            try { url = new URL(value); } catch { throw new Error('Invalid ' + kind + ' public URL'); }
            if (url.protocol !== 'https:' || !url.hostname || url.username ||
              url.password || url.port || url.hash || url.search ||
              (kind === 'cors' && url.pathname !== '/')) {
              throw new Error('Invalid ' + kind + ' public URL');
            }
            return kind === 'cors' ? url.origin + '/' : url.href;
          }

          const cors = validatePublicUrl(process.env.CORS_SERVER || '', 'cors');
          const resolver = validatePublicUrl(process.env.RESOLVER_URL || '', 'resolver');
          const siteName = String(process.env.PREVIEW_SITE_NAME || '').trim();
          if (siteName.length > 80 || /[\r\n<>]/.test(siteName)) {
            throw new Error('Invalid Preview site title variable');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,
            'cors_server=' + cors + '\nresolver_url=' + resolver +
            '\nsite_name=' + (siteName || 'ePlus OnAir — Preview') + '\n');
          console.log(cors || resolver
            ? 'Validated preview public radio config forwarded to preview.'
            : '::notice::No preview public radio config configured; Play will remain disabled.');
          NODE

  build:
    name: "Build isolated preview (no secrets)"
    needs: [preview_config, comment_status]
    if: >-
      needs.preview_config.result == 'success' &&
      needs.comment_status.result == 'success' &&
      (vars.PAGES_PREVIEW_READY == 'true' || (vars.PAGES_PREVIEW_READY == '' && vars.PAGES_DEV_READY == 'true')) &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'staging' &&
      !startsWith(github.event.pull_request.head.ref, 'bot/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: onair-pr-preview-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      active: ${{ steps.current.outputs.active }}
    env:
      # Isolated custom-domain preview and per-PR base path; never inherit production SEO.
      ONAIR_PR_PREVIEW: 'true'
      ONAIR_SKIP_STATION_OG: 'true'
      NUXT_PUBLIC_NO_INDEX: 'true'
      # These are public, validated outputs from the trusted config job.
      # NO Environment or secret is granted to this untrusted PR build.
      NUXT_PUBLIC_CORS_SERVER_1: ${{ needs.preview_config.outputs.cors_server }}
      NUXT_PUBLIC_GLOBAL_RADIO_RESOLVER_URL: ${{ needs.preview_config.outputs.resolver_url }}
      NUXT_PUBLIC_STATION_OG_BASE_URL: ''
      NUXT_PUBLIC_SITE_URL: https://preview.radio.eplus.dev/pr-preview/pr-${{ github.event.pull_request.number }}
      NUXT_PUBLIC_SITE_NAME: ${{ needs.preview_config.outputs.site_name }}
      NUXT_APP_BASE_URL: /pr-preview/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Skip stale or retargeted PR runs
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          read -r state base head repo < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .base.ref, .head.sha, .head.repo.full_name] | @tsv')
          if [ "$state" != open ] || [ "$base" != staging ] || [ "$head" != "$EXPECTED_HEAD" ] || [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::Obsolete or untrusted PR: skip build."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out merge preview (read-only, no credentials retained)
        if: steps.current.outputs.active == 'true'
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Set up Node.js
        if: steps.current.outputs.active == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        if: steps.current.outputs.active == 'true'
        run: npm ci

      - name: Run regression tests
        if: steps.current.outputs.active == 'true'
        run: npm test

      - name: Generate representative static pages
        if: steps.current.outputs.active == 'true'
        run: npm run generate:site

      - name: Check noindex, zero GA4, project path and output size
        if: steps.current.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-staging-noindex.mjs
          node scripts/assert-ga4-output.mjs .output/public development
          node scripts/assert-pr-preview-output.mjs .output/public "$PR_NUMBER"
          node scripts/check-pages-build.mjs .output/public development

      - name: Store preview files (no credentials)
        if: steps.current.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: onair-pr-preview-${{ github.event.pull_request.number }}
          path: .output/public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  publish:
    name: "Publish PR Preview to isolated Pages repository"
    needs: build
    if: >-
      needs.build.result == 'success' &&
      needs.build.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: onair-pr-preview-publish
      cancel-in-progress: false
    environment:
      name: ${{ vars.PAGES_PREVIEW_READY == 'true' && 'preview' || 'development' }}
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Recheck live PR before publish
        id: current
        shell: bash
        run: |
          set -euo pipefail
          read -r state base head repo < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .base.ref, .head.sha, .head.repo.full_name] | @tsv')
          if [ "$state" != open ] || [ "$base" != staging ] || [ "$head" != "$EXPECTED_HEAD" ] || [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::PR changed or closed; skip stale publication."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download validated build artifact
        if: steps.current.outputs.active == 'true'
        uses: actions/download-artifact@v4
        with:
          name: onair-pr-preview-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/pr-output

      - name: Check destination and publish only this PR directory
        if: steps.current.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGES_DEPLOY_TOKEN" || { echo "::error::Missing Preview Environment secret PAGES_DEPLOY_TOKEN."; exit 1; }
          test -f "$RUNNER_TEMP/pr-output/index.html" || { echo "::error::Missing preview home page."; exit 1; }
          test -f "$RUNNER_TEMP/pr-output/asia/viet-nam/vov-gt-hcm/index.html" || { echo "::error::Missing preview station detail."; exit 1; }
          if find "$RUNNER_TEMP/pr-output" -type l -print -quit | grep -q .; then
            echo "::error::Symlinks are forbidden in the published artifact."
            exit 1
          fi
          grep -q "noindex" "$RUNNER_TEMP/pr-output/index.html" || { echo "::error::Preview is indexable."; exit 1; }
          grep -q "/pr-preview/pr-$PR_NUMBER/_nuxt/" "$RUNNER_TEMP/pr-output/index.html" || { echo "::error::Preview base path is incorrect."; exit 1; }
          if grep -q 'G-ETDY41KBBJ' "$RUNNER_TEMP/pr-output/index.html"; then
            echo "::error::Production GA4 is forbidden in preview."
            exit 1
          fi

          auth="$(printf 'x-access-token:%s' "$PAGES_DEPLOY_TOKEN" | base64 -w0)"
          target="$RUNNER_TEMP/onair-pr-pages"
          GIT_TERMINAL_PROMPT=0 git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --depth 1 --branch main "https://github.com/$PREVIEW_TARGET_REPOSITORY.git" "$target" || {
              echo "::error::Create $PREVIEW_TARGET_REPOSITORY and grant PAGES_DEPLOY_TOKEN Contents: write first."
              exit 1
            }

          test ! -L "$target/pr-preview" || { echo "::error::Unsafe preview directory."; exit 1; }
          mkdir -p "$target/pr-preview/pr-$PR_NUMBER"
          rsync -a --delete "$RUNNER_TEMP/pr-output/" "$target/pr-preview/pr-$PR_NUMBER/"
          touch "$target/.nojekyll"
          # The live URL must prove it serves THIS PR head, not an old artifact.
          printf "%s\n" "$EXPECTED_HEAD" > "$target/pr-preview/pr-$PR_NUMBER/preview-commit.txt"

          # GitHub Pages published output must remain under 1 GB.
          # Enforce a safety margin across ALL open PRs, not only this PR.
          total="$(find "$target" -path "$target/.git" -prune -o -type f -printf '%s\n' | awk '{ s += $1 } END { printf "%.0f", s }')"
          echo "Aggregate Pages preview size: $total bytes"
          if [ "$total" -ge 900000000 ]; then
            echo "::error::All previews exceed 900 MB. Close stale PRs or reduce preview output before publishing."
            exit 1
          fi

          git -C "$target" config user.name "github-actions[bot]"
          git -C "$target" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$target" add --all
          if ! git -C "$target" diff --cached --quiet; then
            git -C "$target" commit -m "preview: PR #$PR_NUMBER from $EXPECTED_HEAD"
            git -C "$target" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
          echo "Published PR #$PR_NUMBER to $PREVIEW_TARGET_REPOSITORY"
          echo "### Preview for PR #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_SITE_ORIGIN/pr-preview/pr-$PR_NUMBER/" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live GitHub Pages preview before commenting
        if: steps.current.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="$PREVIEW_SITE_ORIGIN/pr-preview/pr-$PR_NUMBER/"
          marker="${base}preview-commit.txt"
          echo "Waiting for GitHub Pages to publish PR #$PR_NUMBER commit $EXPECTED_HEAD"
          live=false
          # The output Pages repository may still be publishing a large static
          # snapshot after the source artifact has uploaded. Do not mark the
          # Preview unavailable simply because Pages deploy takes >3 minutes.
          for attempt in $(seq 1 90); do
            published_sha="$(curl --location --fail --silent --show-error --max-time 10 "$marker" 2>/dev/null || true)"
            if [ "$published_sha" = "$EXPECTED_HEAD" ]; then
              if curl --location --fail --silent --show-error --max-time 15 "$base" -o "$RUNNER_TEMP/preview-live.html" &&
                 grep -q 'noindex' "$RUNNER_TEMP/preview-live.html"; then
                live=true
                break
              fi
            fi
            if [ "$attempt" -lt 90 ]; then sleep 10; fi
          done
          if [ "$live" != true ]; then
            echo "::error::GitHub Pages preview is not live at $base for commit $EXPECTED_HEAD. Check Settings -> Pages of $PREVIEW_TARGET_REPOSITORY and its 'pages build and deployment' job."
            exit 1
          fi
          echo "Verified GitHub Pages serves the current PR commit at $base"
          echo "### Live Preview Verified" >> "$GITHUB_STEP_SUMMARY"
          echo "$base" >> "$GITHUB_STEP_SUMMARY"

      - name: Show Preview link only after live verification of the current PR/run
        if: steps.current.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A new PR head or a newer run must never restore an old link.
          read -r state base head repo < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .base.ref, .head.sha, .head.repo.full_name] | @tsv')
          if [ "$state" != open ] || [ "$base" != staging ] || [ "$head" != "$EXPECTED_HEAD" ] || [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::PR changed while Pages was publishing; keep Preview link hidden."
            exit 0
          fi
          marker_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select((.body // "") | contains("<!-- onair-pr-preview -->")) | .id' | head -n 1)"
          if [ -z "$marker_id" ]; then
            echo "::error::Missing Preview status comment. Refuse to post an unverified link."
            exit 1
          fi
          current_body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$marker_id" --jq .body)"
          if [[ "$current_body" != *"<!-- onair-preview-run:$GITHUB_RUN_ID -->"* ]] ||
             [[ "$current_body" != *"<!-- onair-preview-head:$EXPECTED_HEAD -->"* ]]; then
            echo "::notice::A newer workflow owns the Preview comment; do not restore a stale link."
            exit 0
          fi
          url="$PREVIEW_SITE_ORIGIN/pr-preview/pr-$PR_NUMBER/"
          body="$(printf '<!-- onair-pr-preview -->\n<!-- onair-preview-head:%s -->\n<!-- onair-preview-run:%s -->\n### ePlus OnAir — PR Preview\n\n✅ **Preview ready** for commit `%s`.\n\n[Open preview](%s) · [View build status](https://github.com/%s/actions/runs/%s)\n\nStatic preview: representative routes only; full catalog remains on Staging after merge. Noindex and production GA4 disabled.\n' "$EXPECTED_HEAD" "$GITHUB_RUN_ID" "$EXPECTED_HEAD" "$url" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          jq -n --arg body "$body" '{body:$body}' | gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$marker_id" --input - >/dev/null


  # Runs after all jobs, even if tests, publish or live URL verification failed.
  # A failed build must not leave the comment at "Building…" indefinitely.
  finalize_comment:
    name: "Remove Preview link if build or live verification fails"
    needs: [comment_status, preview_config, build, publish]
    if: >-
      always() &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.comment_status.result == 'success' &&
      needs.publish.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Mark Preview as unavailable without displaying a URL
        shell: bash
        run: |
          set -euo pipefail
          read -r state base head repo < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .base.ref, .head.sha, .head.repo.full_name] | @tsv')
          if [ "$state" != open ] || [ "$base" != staging ] || [ "$head" != "$EXPECTED_HEAD" ] || [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::Outdated failure result; leave current PR comment unchanged."
            exit 0
          fi
          marker_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select((.body // "") | contains("<!-- onair-pr-preview -->")) | .id' | head -n 1)"
          if [ -z "$marker_id" ]; then
            echo "::notice::No Preview comment to update."
            exit 0
          fi
          current_body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$marker_id" --jq .body)"
          if [[ "$current_body" != *"<!-- onair-preview-run:$GITHUB_RUN_ID -->"* ]] ||
             [[ "$current_body" != *"<!-- onair-preview-head:$EXPECTED_HEAD -->"* ]]; then
            echo "::notice::Newer Preview run already owns the comment."
            exit 0
          fi
          body="$(printf '<!-- onair-pr-preview -->\n<!-- onair-preview-head:%s -->\n<!-- onair-preview-run:%s -->\n### ePlus OnAir — PR Preview\n\n❌ **Preview unavailable.** Build, publication or live URL verification did not finish successfully; the Preview link is hidden.\n\n[View build status](https://github.com/%s/actions/runs/%s)\n' "$EXPECTED_HEAD" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          jq -n --arg body "$body" '{body:$body}' | gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$marker_id" --input - >/dev/null


  cleanup:
    name: "Remove closed PR Preview"
    if: >-
      (vars.PAGES_PREVIEW_READY == 'true' || (vars.PAGES_PREVIEW_READY == '' && vars.PAGES_DEV_READY == 'true')) &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: onair-pr-preview-publish
      cancel-in-progress: false
    environment:
      name: ${{ vars.PAGES_PREVIEW_READY == 'true' && 'preview' || 'development' }}
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
    steps:
      - name: Delete only the preview directory for this closed PR
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGES_DEPLOY_TOKEN" || { echo "::error::Missing Preview Environment secret PAGES_DEPLOY_TOKEN."; exit 1; }
          # An obsolete close event must not delete a reopened preview.
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state')"
          if [ "$state" != closed ]; then
            echo "::notice::PR is open again; skip stale cleanup."
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$PAGES_DEPLOY_TOKEN" | base64 -w0)"
          target="$RUNNER_TEMP/onair-pr-pages"
          GIT_TERMINAL_PROMPT=0 git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --depth 1 --branch main "https://github.com/$PREVIEW_TARGET_REPOSITORY.git" "$target"
          preview="$target/pr-preview/pr-$PR_NUMBER"
          if [ -d "$preview" ] && [ ! -L "$preview" ]; then
            rm -rf -- "$preview"
            git -C "$target" config user.name "github-actions[bot]"
            git -C "$target" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$target" add --all
            if ! git -C "$target" diff --cached --quiet; then
              git -C "$target" commit -m "preview: remove closed PR #$PR_NUMBER"
              git -C "$target" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
            fi
          else
            echo "No preview directory exists for PR #$PR_NUMBER."
          fi
