# Temporary read-only inventory. No raw alert data is printed, persisted or uploaded.
# Delete this workflow after gathering summary; never include secrets or exploit traces.
name: "One-time Code Scanning inventory"
on:
  push:
    branches:
      - audit/code-scanning-inventory-20261102

permissions:
  contents: read
  security-events: read

jobs:
  inventory:
    name: "Summarize open Code Scanning alerts"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Read default-branch alerts and print sanitized aggregates"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/code-scanning-alerts.json"
          # GitHub's own short-lived GITHUB_TOKEN; no PAT, write actions or external destinations.
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100" > "$file"
          jq -e 'type == "array"' "$file" >/dev/null
          echo "=== Open Code Scanning alerts on main ==="
          jq -r '
            [ .[][] | select(.state == "open") ] as $alerts
            | "Total: \($alerts|length)",
              "Severity groups:",
              ( $alerts
                | group_by(.rule.security_severity_level // .rule.severity // "unknown")
                | .[] | "  \(.[0].rule.security_severity_level // .[0].rule.severity // "unknown"): \(length)" ),
              "Rules (rule ID, severity, count):",
              ( $alerts | group_by(.rule.id) | sort_by(-length) | .[]
                | "  \(.[0].rule.id) | \(.[0].rule.security_severity_level // .[0].rule.severity // "unknown") | \(length)" )
          ' "$file"
          echo "Affected source locations (rule, file, line only):"
          jq -r '
            [ .[][] | select(.state == "open") ] | sort_by(.rule.id)
            | .[] | "  \(.rule.id) | \(.most_recent_instance.location.path // "unknown") | line \(.most_recent_instance.location.start_line // 0)"
          ' "$file"
          rm -f "$file"
          echo "No alert bodies, source paths, tokens or SARIF uploaded."
