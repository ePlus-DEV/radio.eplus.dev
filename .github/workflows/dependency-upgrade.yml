name: "Refresh frontend dependencies"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-upgrade.yml"

permissions:
  contents: write

concurrency:
  group: dependency-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  upgrade:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/upgrade-frontend-stack-2026'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Upgrade top-level npm dependencies
        run: npx --yes npm-check-updates@latest -u

      - name: Refresh lockfile
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Commit refreshed dependency files
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade npm dependencies"
          git push origin "HEAD:${{ github.head_ref }}"
