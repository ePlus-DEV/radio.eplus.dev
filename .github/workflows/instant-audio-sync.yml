name: "Radio data sync"
run-name: "Radio sync • ${{ github.event_name }} • country=${{ inputs.country || 'auto' }} • max=${{ inputs.max_countries || '3' }}"

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Optional: sync one country only (e.g. latvia). Leave empty for automatic selection."
        required: false
        type: string
      refresh_existing:
        description: "Refresh existing countries instead of prioritizing missing countries."
        required: false
        default: false
        type: boolean
      max_countries:
        description: "Max countries THIS run (default 3). Re-running before the bot PR is merged may select the same countries again."
        required: false
        default: "3"
        type: string
  pull_request:
    paths:
      - ".github/workflows/instant-audio-sync.yml"
      - "scripts/sync-instant-audio.mjs"
      - "data/instant-audio-countries.json"
      - "docs/instant-audio-sync.md"

permissions:
  contents: read

concurrency:
  group: instant-audio-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "PR checks only — no live sync"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"

      - name: "Install dependencies"
        run: npm ci

      - name: "Validate radio sync"
        run: |
          node --check scripts/sync-instant-audio.mjs
          npm test

  sync:
    name: "Live sync — manual/schedule only"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: "Show effective sync settings"
        shell: bash
        run: |
          {
            echo "## Radio sync settings"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Country: \`${{ inputs.country || 'automatic selection' }}\`"
            echo "- Max countries this run: \`${{ inputs.max_countries || '3' }}\`"
            echo "- Refresh existing: \`${{ inputs.refresh_existing || 'false' }}\`"
            echo ""
            echo "> Note: each run starts from \`main\`. If the current bot data PR has not been merged yet, another manual run can select the same countries again."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Discover and sync radio countries"
        id: sync
        shell: bash
        run: |
          ARGS=(--max-countries="${{ inputs.max_countries || '3' }}")

          if [[ -n "${{ inputs.country || '' }}" ]]; then
            ARGS+=(--country="${{ inputs.country }}")
          fi

          if [[ "${{ inputs.refresh_existing || 'false' }}" == "true" ]]; then
            ARGS+=(--refresh-existing)
          fi

          node scripts/sync-instant-audio.mjs "${ARGS[@]}"

          if git diff --quiet -- .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Validate synced data"
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          node --check scripts/sync-instant-audio.mjs

          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { join } from "node:path";

          const changed = execFileSync(
            "git",
            ["diff", "--name-only", "--diff-filter=ACM", "--", "public/radio", "data/instant-audio-countries.json"],
            { encoding: "utf8" },
          )
            .trim()
            .split("\n")
            .filter(Boolean);

          for (const file of changed.filter((file) => file.endsWith(".json"))) {
            const data = JSON.parse(readFileSync(file, "utf8"));

            if (
              file.startsWith("public/radio/") &&
              file !== "public/radio/world.json"
            ) {
              for (const [slug, station] of Object.entries(data)) {
                if (!station || typeof station !== "object") {
                  throw new Error(`${file}: invalid station ${slug}`);
                }

                if (
                  typeof station.stream !== "string" ||
                  !/^https?:\/\//i.test(station.stream)
                ) {
                  throw new Error(`${file}: station ${slug} has invalid stream`);
                }

                if (String(station.features || "").startsWith("/img/")) {
                  const imageFile = join("public", station.features);
                  if (!existsSync(imageFile)) {
                    throw new Error(
                      `${file}: station ${slug} references missing image ${station.features}`,
                    );
                  }
                }
              }
            }

            console.log(`Validated ${file}`);
          }
          NODE

      - name: "Create or update sync pull request"
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="bot/instant-audio-sync"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$BRANCH"
          git add public/radio public/img data/world.ts data/instant-audio-countries.json lang
          git commit -m "data: sync radio countries from InstantAudio"
          git push --force-with-lease origin "$BRANCH"

          PR_NUMBER="$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<'EOF'
          ## Automated radio data sync

          This PR was generated by the **InstantAudio data sync** workflow.

          - discovers countries from https://instant.audio/
          - uses the station API pattern exposed by InstantAudio country sites
          - only imports stations with a validated stream URL
          - updates country JSON, world metadata, localized country names, and flags
          - downloads station artwork into `public/img/<area>/<country>/` and stores local image paths in JSON
          - validates changed JSON, station stream URLs, and locally referenced station images
          - pull-request validation runs syntax checks and unit tests only; it does not call live radio providers

          Review stream ownership/availability before merging. The InstantAudio endpoint is externally operated and is treated as an upstream data source, not as a guaranteed public API contract.
          EOF

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" \
              --title "data: sync radio data from InstantAudio" \
              --body-file "$BODY_FILE"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "data: sync radio data from InstantAudio" \
              --body-file "$BODY_FILE"
          fi
