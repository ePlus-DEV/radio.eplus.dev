name: "Radio data sync"
run-name: "Radio sync • ${{ github.event_name }} • mode=${{ inputs.sync_mode || 'validate' }} • country=${{ inputs.country || 'Auto selection' }} • batch=${{ inputs.batch_size || '5' }}"

on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "What should this run update?"
        required: true
        default: "missing_countries"
        type: choice
        options:
          - missing_countries
          - refresh_existing
          - missing_flags
      batch_size:
        description: "Countries per run. Keep batches small so artwork/stream checks finish before timeout."
        required: true
        default: "5"
        type: choice
        options:
          - "3"
          - "5"
          - "10"
      country:
        description: "Choose one country, or Auto selection to use the selected batch mode."
        required: true
        default: "Auto selection"
        type: choice
        options:
          - "Auto selection"
          - "Algérie | algeria"
          - "Argentina | argentina"
          - "Australia | australia"
          - "Bangladesh | bangladesh"
          - "België | belgium"
          - "Bolivia | bolivia"
          - "Brasil | brazil"
          - "Cameroon | cameroon"
          - "Česká republika | czechia"
          - "Chile | chile"
          - "Colombia | colombia"
