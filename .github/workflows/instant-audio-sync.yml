name: "InstantAudio data sync"

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Country slug to sync (optional, e.g. latvia)"
        required: false
        type: string
      refresh_existing:
        description: "Refresh an existing country instead of missing countries only"
        required: false
        default: false
        type: boolean
      max_countries:
        description: "Maximum missing countries per run"
        required: false
        default: "3"
        type: string
  schedule:
    - cron: "17 3 * * 0"
  pull_request:
    paths:
      - ".github/workflows/instant-audio-sync.yml"
      - "scripts/sync-instant-audio.mjs"

permissions:
  contents: read

concurrency:
  group: instant-audio-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"

      - name: "Validate InstantAudio API discovery"
        run: |
          node scripts/sync-instant-audio.mjs \
            --country=cuba \
            --refresh-existing \
            --max-stations=3 \
            --dry-run

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: "Discover and sync missing countries"
        id: sync
        shell: bash
        run: |
          ARGS=(--max-countries="${{ inputs.max_countries || '3' }}")

          if [[ -n "${{ inputs.country || '' }}" ]]; then
            ARGS+=(--country="${{ inputs.country }}")
          fi

          if [[ "${{ inputs.refresh_existing || 'false' }}" == "true" ]]; then
            ARGS+=(--refresh-existing)
          fi

          node scripts/sync-instant-audio.mjs "${ARGS[@]}"

          if git diff --quiet -- .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Validate generated data"
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm ci
          npm run generate

      - name: "Create or update sync pull request"
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="bot/instant-audio-sync"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$BRANCH"
          git add public/radio public/img data/world.ts lang
          git commit -m "data: sync radio countries from InstantAudio"
          git push --force-with-lease origin "$BRANCH"

          PR_NUMBER="$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<'EOF'
          ## Automated radio data sync

          This PR was generated by the **InstantAudio data sync** workflow.

          - discovers countries from https://instant.audio/
          - uses the station API pattern exposed by InstantAudio country sites
          - only imports stations with a validated stream URL
          - updates country JSON, world metadata, localized country names, and flags
          - runs the Nuxt production generator before opening/updating this PR

          Review stream ownership/availability before merging. The InstantAudio endpoint is externally operated and is treated as an upstream data source, not as a guaranteed public API contract.
          EOF

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" \
              --title "data: sync missing radio countries from InstantAudio" \
              --body-file "$BODY_FILE"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "data: sync missing radio countries from InstantAudio" \
              --body-file "$BODY_FILE"
          fi
