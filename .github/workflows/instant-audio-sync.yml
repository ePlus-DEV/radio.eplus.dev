          - "Lietuva | lithuania"
          - "Madagasikara | madagascar"
          - "Magyarország | hungary"
          - "Malaysia | malaysia"
          - "Maroc | morocco"
          - "México | mexico"
          - "Misr | egypt"
          - "Nederland | netherlands"
          - "Nepāla | nepal"
          - "New Zealand | new-zealand"
          - "Nicaragua | nicaragua"
          - "Nigeria | nigeria"
          - "Nihon | japan"
          - "Norge | norway"
          - "Österreich | austria"
          - "Pakistan | pakistan"
          - "Panamá | panama"
          - "Paraguay | paraguay"
          - "Perú | peru"
          - "Philippines | philippines"
          - "Polska | poland"
