# One-time validation of known CodeQL High rules on this fix branch.
# No SARIF is uploaded or persisted. Remove after verifying the results.
name: "Temporary CodeQL fix verification"
on:
  push:
    branches:
      - fix/codeql-four-high-alerts-20261102

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-verification
      - name: "Assert the four original CodeQL findings are absent"
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(codeql-verification/*.sarif)
          if (( ${#files[@]} == 0 )); then
            echo "::error::CodeQL did not generate a SARIF report"
            exit 1
          fi
          jq -s -r '
            [ .[] | .runs[]? | .results[]? | .ruleId ] as $found
            | [ "js/bad-tag-filter", "js/double-escaping",
                "js/incomplete-url-substring-sanitization" ] as $targets
            | $targets[]
            | . as $rule
            | "\($rule) : \([$found[] | select(. == $rule)] | length)"
          ' "${files[@]}" | tee "$RUNNER_TEMP/targeted-rule-counts.txt"
          if grep -Eq ' : [1-9][0-9]*$' "$RUNNER_TEMP/targeted-rule-counts.txt"; then
            echo "::error::One or more original CodeQL rules are still firing"
            exit 1
          fi
          echo "Confirmed: zero results for the three targeted CodeQL rules."
