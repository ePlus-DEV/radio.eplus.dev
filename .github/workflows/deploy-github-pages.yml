name: "Deploy ePlus OnAir to GitHub Pages"

# Deploy only merged, trusted source. Never give publishing credentials to PRs.
on:
  push:
    branches: [develop, main]
    # Only changes to the delivered website justify regenerating thousands of
    # station pages. Workflows, docs, tests and one-off crawlers do not.
    paths:
      - "app.vue"
      - "app.config.ts"
      - "error.vue"
      - "nuxt.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "assets/**"
      - "build/**"
      - "components/**"
      - "composables/**"
      - "config/**"
      - "data/**"
      - "lang/**"
      - "layouts/**"
      - "middleware/**"
      - "pages/**"
      - "plugins/**"
      - "public/**"
      - "server/**"
      - "stores/**"
      - "types/**"
      - "utils/**"
      - "scripts/build-station-search-index.mjs"
      - "scripts/generate-social-preview.mjs"
      - "scripts/generate-station-og-images.mjs"
  # Manual deploy remains possible even without site changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: "Publish ${{ github.ref_name }} to Pages"
    # Keep both targets disabled until the public Pages repositories, credentials
    # and branch publishing settings have been configured and verified.
    if: >-
      (github.ref_name == 'develop' && vars.PAGES_DEV_READY == 'true') ||
      (github.ref_name == 'main' && vars.PAGES_PROD_READY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Both repositories are GitHub PROJECT Pages until custom domains are
      # explicitly introduced in a separate migration.
      NUXT_PUBLIC_SITE_URL: ${{ github.ref_name == 'main' && 'https://eplus-dev.github.io/onair-production-pages' || 'https://eplus-dev.github.io/onair-staging-pages' }}
      NUXT_APP_BASE_URL: ${{ github.ref_name == 'main' && '/onair-production-pages/' || '/onair-staging-pages/' }}
      # Both previews are public but must stay out of search results.
      NUXT_PUBLIC_NO_INDEX: 'true'
      TARGET_REPOSITORY: ${{ github.ref_name == 'main' && 'ePlus-DEV/onair-production-pages' || 'ePlus-DEV/onair-staging-pages' }}
      TARGET_KIND: 'staging'
      SEO_EXPECTED_SITE_URL: ${{ github.ref_name == 'main' && 'https://eplus-dev.github.io/onair-production-pages' || 'https://eplus-dev.github.io/onair-staging-pages' }}
    steps:
      # Cheap preflight BEFORE npm ci and 4,000+ page prerender. This catches
      # missing target repositories, expired PATs and wrong credentials fast.
      - name: Verify exact Pages repository and PAT before building
        shell: bash
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          case "$TARGET_REPOSITORY" in
            ePlus-DEV/onair-staging-pages|ePlus-DEV/onair-production-pages) ;;
            *) echo "::error::Unexpected Pages target repository"; exit 1 ;;
          esac
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Missing PAGES_DEPLOY_TOKEN in the private source repository."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$PAGES_DEPLOY_TOKEN" | base64 -w0)"
          if ! GIT_TERMINAL_PROMPT=0 git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote --exit-code "https://github.com/$TARGET_REPOSITORY.git" refs/heads/main >/dev/null; then
            echo "::error::Pages target $TARGET_REPOSITORY is missing or this token cannot read it."
            exit 1
          fi
          echo "Validated target $TARGET_REPOSITORY, no extra repository or custom domain needed."

      - name: Check out private source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Generate static website
        run: npm run generate

      - name: Check SEO for chosen environment
        run: |
          node scripts/assert-sitemap-xml.mjs
          node scripts/assert-route-social-meta.mjs
          node scripts/assert-brand-assets.mjs
          if [ "$TARGET_KIND" = staging ]; then
            node scripts/assert-staging-noindex.mjs
          fi

      - name: Check Pages output and GitHub hosting size limit
        run: node scripts/check-pages-build.mjs .output/public "$TARGET_KIND"

      - name: Publish generated output to public repository
        shell: bash
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Missing PAGES_DEPLOY_TOKEN secret with Contents: Read and write access to both public Pages repositories."
            exit 1
          fi

          target="$RUNNER_TEMP/onair-pages"
          auth="$(printf 'x-access-token:%s' "$PAGES_DEPLOY_TOKEN" | base64 -w0)"
          GIT_TERMINAL_PROMPT=0 git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 --branch main "https://github.com/$TARGET_REPOSITORY.git" "$target"
          rsync -a --delete --exclude='.git/' "$GITHUB_WORKSPACE/.output/public/" "$target/"
          touch "$target/.nojekyll"

          # GitHub project Pages with no custom domain: never emit CNAME.
          rm -f "$target/CNAME"

          git -C "$target" config user.name "github-actions[bot]"
          git -C "$target" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$target" add --all

          if git -C "$target" diff --cached --quiet; then
            echo "No changes to publish to $TARGET_REPOSITORY."
            exit 0
          fi

          git -C "$target" commit -m "deploy: $TARGET_KIND from $GITHUB_REPOSITORY@$GITHUB_SHA"
          # GITHUB_TOKEN cannot write to a different repository. Keep the
          # repository-scoped PAT out of the remote URL and git configuration.
          auth="$(printf 'x-access-token:%s' "$PAGES_DEPLOY_TOKEN" | base64 -w0)"
          git -C "$target" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          echo "Published $TARGET_KIND to $TARGET_REPOSITORY"
