name: "Deploy ePlus OnAir to GitHub Pages"

# Deploy only merged, trusted source. Never give publishing credentials to PRs.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: "Publish ${{ github.ref_name }} to Pages"
    # Keep both targets disabled until the public Pages repositories, credentials
    # and branch publishing settings have been configured and verified.
    if: >-
      (github.ref_name == 'develop' && vars.PAGES_DEV_READY == 'true') ||
      (github.ref_name == 'main' && vars.PAGES_PROD_READY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NUXT_PUBLIC_SITE_URL: ${{ github.ref_name == 'main' && 'https://radio.eplus.dev' || vars.PAGES_DEV_SITE_URL || 'https://eplus-dev.github.io' }}
      NUXT_PUBLIC_NO_INDEX: ${{ github.ref_name == 'main' && 'false' || 'true' }}
      TARGET_REPOSITORY: ${{ github.ref_name == 'main' && 'ePlus-DEV/onair-production-pages' || 'ePlus-DEV/ePlus-DEV.github.io' }}
      TARGET_KIND: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      SEO_EXPECTED_SITE_URL: ${{ github.ref_name == 'main' && 'https://radio.eplus.dev' || vars.PAGES_DEV_SITE_URL || 'https://eplus-dev.github.io' }}
    steps:
      - name: Validate staging GitHub Pages origin
        if: env.TARGET_KIND == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            let url;
            try { url = new URL(process.env.NUXT_PUBLIC_SITE_URL || ""); }
            catch { console.error("::error::Invalid PAGES_DEV_SITE_URL."); process.exit(1); }
            if (url.protocol !== "https:" || url.pathname !== "/" || url.search || url.hash || url.username || url.password || url.hostname === "radio.eplus.dev") {
              console.error("::error::DEV requires its own HTTPS origin at the site root.");
              process.exit(1);
            }
            if (url.hostname.endsWith(".github.io") && url.hostname !== "eplus-dev.github.io") {
              console.error("::error::Only eplus-dev.github.io is supported for the organization root Pages site.");
              process.exit(1);
            }
            console.log("Staging origin: " + url.origin);
          '

      - name: Check out private source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Generate static website
        run: npm run generate

      - name: Check SEO for chosen environment
        run: |
          node scripts/assert-sitemap-xml.mjs
          node scripts/assert-route-social-meta.mjs
          node scripts/assert-brand-assets.mjs
          if [ "$TARGET_KIND" = staging ]; then
            node scripts/assert-staging-noindex.mjs
          fi

      - name: Check Pages output and GitHub hosting size limit
        run: node scripts/check-pages-build.mjs .output/public "$TARGET_KIND"

      - name: Publish generated output to public repository
        shell: bash
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Missing PAGES_DEPLOY_TOKEN secret with Contents: Read and write access to both public Pages repositories."
            exit 1
          fi

          target="$RUNNER_TEMP/onair-pages"
          git clone --depth 1 --branch main "https://github.com/$TARGET_REPOSITORY.git" "$target"
          rsync -a --delete --exclude='.git/' "$GITHUB_WORKSPACE/.output/public/" "$target/"
          touch "$target/.nojekyll"

          # Organization Pages default hostname must not include CNAME.
          # When a real custom domain is configured later, publish its hostname.
          if [ "$TARGET_KIND" = staging ] && [ "$NUXT_PUBLIC_SITE_URL" = "https://eplus-dev.github.io" ]; then
            rm -f "$target/CNAME"
          else
            node --input-type=module -e '
              const url = new URL(process.env.NUXT_PUBLIC_SITE_URL);
              if (url.protocol !== "https:" || url.pathname !== "/" || url.search || url.hash) process.exit(1);
              process.stdout.write(url.hostname + "\n");
            ' > "$target/CNAME"
          fi

          git -C "$target" config user.name "github-actions[bot]"
          git -C "$target" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$target" add --all

          if git -C "$target" diff --cached --quiet; then
            echo "No changes to publish to $TARGET_REPOSITORY."
            exit 0
          fi

          git -C "$target" commit -m "deploy: $TARGET_KIND from $GITHUB_REPOSITORY@$GITHUB_SHA"
          # GITHUB_TOKEN cannot write to a different repository. Keep the
          # repository-scoped PAT out of the remote URL and git configuration.
          auth="$(printf 'x-access-token:%s' "$PAGES_DEPLOY_TOKEN" | base64 -w0)"
          git -C "$target" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          echo "Published $TARGET_KIND to $TARGET_REPOSITORY"
