name: "CI"

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app.vue"
      - "app.config.ts"
      - "playwright.config.ts"
      - "types/**"
      - "utils/**"
      - "nuxt.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "components/**"
      - "composables/**"
      - "layouts/**"
      - "middleware/**"
      - "pages/**"
      - "plugins/**"
      - "stores/**"
      - "assets/**"
      - "lang/**"
      - "data/**"
      - "public/radio/**"
      - "public/brand/**"
      - "build/**"
      - "server/**"
      - "scripts/**"
      - "tests/**"
      # Check workflow changes as well as application changes.
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "public/img/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The data-sync bot opens large catalog PRs directly against main.
  # Preserve its fast validation without rerunning all ~4k Nuxt pages.
  data-sync:
    name: "Validate radio sync bot PR"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'bot/instant-audio-sync' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"
      - name: "Install dependencies"
        run: npm ci
      - name: "Validate sync script"
        run: node --check scripts/sync-instant-audio.mjs
      - name: "Run unit tests"
        run: npm test

  test:
    name: "Test and prerender"
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref != 'bot/instant-audio-sync' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Run unit tests"
        run: npm test

      - name: "Generate prerendered site"
        # CI uses the same two public variables as the real staging host.
        # A checkout/branch name must not change the generated SEO policy.
        env:
          NUXT_PUBLIC_SITE_URL: ${{ github.base_ref == 'develop' && 'https://radio-new.eplus.dev' || 'https://radio.eplus.dev' }}
          NUXT_PUBLIC_NO_INDEX: ${{ github.base_ref == 'develop' && 'true' || 'false' }}
        run: npm run generate

      - name: "Validate generated sitemap and staging indexability"
        env:
          NUXT_PUBLIC_SITE_URL: ${{ github.base_ref == 'develop' && 'https://radio-new.eplus.dev' || 'https://radio.eplus.dev' }}
          NUXT_PUBLIC_NO_INDEX: ${{ github.base_ref == 'develop' && 'true' || 'false' }}
        run: node scripts/assert-sitemap-xml.mjs

      - name: "Assert route-specific prerendered Open Graph metadata"
        env:
          SEO_EXPECTED_SITE_URL: ${{ github.base_ref == 'develop' && 'https://radio-new.eplus.dev' || 'https://radio.eplus.dev' }}
        run: node scripts/assert-route-social-meta.mjs

      - name: "Audit all stations Open Graph HTML and JPEG images"
        env:
          SEO_EXPECTED_SITE_URL: ${{ github.base_ref == 'develop' && 'https://radio-new.eplus.dev' || 'https://radio.eplus.dev' }}
        run: node scripts/assert-all-station-social-meta.mjs

      - name: "Verify ePlus OnAir logo, social image and favicons"
        run: node scripts/assert-brand-assets.mjs

      - name: "Assert staging pages are noindex"
        if: github.base_ref == 'develop'
        run: node scripts/assert-staging-noindex.mjs

      # Browser tests are temporarily opt-in at the owner's request.
      # Keep npm run test:ui available for focused follow-up checks.
      - name: "Install Chromium for UI regression tests"
        if: ${{ vars.ENABLE_BROWSER_TESTS == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: "Verify persistent player and responsive UI"
        if: ${{ vars.ENABLE_BROWSER_TESTS == 'true' }}
        run: npm run test:ui

  # DigitalOcean auto-deploys each tracked branch into its own app.
  # Read-only status polling; never create another deployment.
  monitor-deployment:
    name: "DigitalOcean deployment (${{ github.ref_name }})"
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"

      - name: "Wait for matching DigitalOcean deployment and site health"
        env:
          DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
          DIGITALOCEAN_STAGING_APP_ID: ${{ vars.DIGITALOCEAN_STAGING_APP_ID }}
          DIGITALOCEAN_STAGING_SITE_URL: ${{ vars.DIGITALOCEAN_STAGING_SITE_URL }}
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
        run: node scripts/monitor-digitalocean-deploy.mjs
