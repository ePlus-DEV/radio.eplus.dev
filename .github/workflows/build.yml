name: "Build Nuxt application"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: nuxt-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Generate Nuxt application"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: "Verify build without deployment secrets"
        run: |
          rm -f .env
          test -z "${NUXT_PUBLIC_ALGOLIA_APPLICATION_ID:-}"
          test -z "${NUXT_PUBLIC_ALGOLIA_API_KEY:-}"

      - name: "Install dependencies"
        run: npm ci

      - name: "Generate application"
        run: npm run generate
