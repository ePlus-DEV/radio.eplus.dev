name: "CI"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app.vue"
      - "app.config.ts"
      - "playwright.config.ts"
      - "types/**"
      - "utils/**"
      - "nuxt.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "components/**"
      - "composables/**"
      - "layouts/**"
      - "middleware/**"
      - "pages/**"
      - "plugins/**"
      - "stores/**"
      - "assets/**"
      - "lang/**"
      - "data/**"
      - "public/radio/**"
      - "build/**"
      - "server/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test and prerender"
    if: github.event.pull_request.head.ref != 'bot/instant-audio-sync'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Run unit tests"
        run: npm test

      - name: "Generate prerendered site"
        run: npm run generate

      - name: "Install Chromium for UI regression tests"
        run: npx playwright install --with-deps chromium

      - name: "Verify persistent player and responsive UI"
        run: npm run test:ui
