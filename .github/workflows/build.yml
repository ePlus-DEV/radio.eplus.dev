name: "CI"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app.vue"
      - "app.config.ts"
      - "playwright.config.ts"
      - "types/**"
      - "utils/**"
      - "nuxt.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "components/**"
      - "composables/**"
      - "layouts/**"
      - "middleware/**"
      - "pages/**"
      - "plugins/**"
      - "stores/**"
      - "assets/**"
      - "lang/**"
      - "data/**"
      - "public/radio/**"
      - "public/brand/**"
      - "build/**"
      - "server/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test and prerender"
    if: github.event.pull_request.head.ref != 'bot/instant-audio-sync'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Run unit tests"
        run: npm test

      - name: "Generate prerendered site"
        # CI uses the same two public variables as the real staging host.
        # A checkout/branch name must not change the generated SEO policy.
        env:
          NUXT_PUBLIC_SITE_URL: ${{ github.base_ref == 'develop' && 'https://radio-new.eplus.dev' || 'https://radio.eplus.dev' }}
          NUXT_PUBLIC_NO_INDEX: ${{ github.base_ref == 'develop' && 'true' || 'false' }}
        run: npm run generate

      - name: "Assert route-specific prerendered Open Graph metadata"
        env:
          SEO_EXPECTED_SITE_URL: ${{ github.base_ref == 'develop' && 'https://radio-new.eplus.dev' || 'https://radio.eplus.dev' }}
        run: node scripts/assert-route-social-meta.mjs

      - name: "Audit all stations Open Graph HTML and JPEG images"
        env:
          SEO_EXPECTED_SITE_URL: ${{ github.base_ref == 'develop' && 'https://radio-new.eplus.dev' || 'https://radio.eplus.dev' }}
        run: node scripts/assert-all-station-social-meta.mjs

      - name: "Verify ePlus OnAir logo, social image and favicons"
        run: node scripts/assert-brand-assets.mjs

      - name: "Assert staging pages are noindex"
        if: github.base_ref == 'develop'
        run: node scripts/assert-staging-noindex.mjs

      # Browser tests are temporarily opt-in at the owner's request.
      # Keep npm run test:ui available for focused follow-up checks.
      - name: "Install Chromium for UI regression tests"
        if: ${{ vars.ENABLE_BROWSER_TESTS == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: "Verify persistent player and responsive UI"
        if: ${{ vars.ENABLE_BROWSER_TESTS == 'true' }}
        run: npm run test:ui
