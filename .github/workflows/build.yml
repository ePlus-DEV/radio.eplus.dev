name: "CI"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "app.vue"
      - "app.config.ts"
      - "playwright.config.ts"
      - "types/**"
      - "utils/**"
      - "nuxt.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "components/**"
      - "composables/**"
      - "layouts/**"
      - "middleware/**"
      - "pages/**"
      - "plugins/**"
      - "stores/**"
      - "assets/**"
      - "lang/**"
      - "data/**"
      - "public/radio/**"
      - "public/brand/**"
      - "build/**"
      - "server/**"
      - "scripts/**"
      - "tests/**"
      # Check workflow changes as well as application changes.
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "public/img/**"

permissions:
  contents: read
  pull-requests: read

# All repository work shares one queue, including different PRs/branches.
# Preserve distinct queued work; never interrupt an active deploy/image upload.
concurrency:
  group: onair-repository-work
  queue: max
  cancel-in-progress: false

jobs:
  # The data-sync bot opens large catalog PRs directly against main.
  # Preserve its fast validation without rerunning all ~4k Nuxt pages.
  data-sync:
    name: "Validate radio sync bot PR"
    if: github.event.pull_request.head.ref == 'bot/instant-audio-sync' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"
      - name: "Install dependencies"
        run: npm ci
      - name: "Validate sync script"
        run: node --check scripts/sync-instant-audio.mjs
      - name: "Run unit tests"
        run: npm test

  test:
    env:
      ONAIR_SKIP_STATION_OG: 'true'
      NUXT_PUBLIC_STATION_OG_BASE_URL: ${{ vars.STATION_OG_BASE_URL }}
    name: "Test and prerender"
    if: github.event.pull_request.head.ref != 'bot/instant-audio-sync' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v7
        with:
          # GitHub Actions checks out a synthetic PR merge commit. Fetch base
          # history so the scope check can reliably diff it against the PR base.
          fetch-depth: 0

      # A PR may be retargeted while previous jobs are still queued. Its
      # historical event may say 'dev' even when the live PR targets 'develop'.
      # A mismatched event must fail BEFORE npm ci / thousands of routes.
      - name: "Confirm live PR base before expensive CI"
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_REF: ${{ github.base_ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          read -r live_base live_head live_state < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.base.ref, .head.sha, .state] | @tsv')
          if [ "$live_state" != open ] || [ "$live_head" != "$EVENT_HEAD_SHA" ]; then
            echo "::notice::Skip obsolete PR run: the PR is closed or its head commit has changed."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          case "$live_base" in
            develop|main) ;;
            *) echo "::error::Unsupported target branch: $live_base"; exit 1 ;;
          esac
          if [ "$live_base" != "$EVENT_BASE_REF" ]; then
            echo "::error::PR was retargeted from $EVENT_BASE_REF to $live_base while this run was queued. Wait for a fresh PR synchronize run."
            exit 1
          fi
          echo "::notice::Confirmed PR target $live_base; safe to select its CI/SEO profile."

      - name: "Determine whether full prerender is needed"
        id: scope
        if: steps.current.outputs.run == 'true'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$PR_BASE_SHA"...HEAD > "$RUNNER_TEMP/pr-changed-paths.txt"

          # Fail closed: unknown/app/data/SEO/build-script changes must get
          # the complete Nuxt generation and all generated-output audits.
          prerender=false
          if [ ! -s "$RUNNER_TEMP/pr-changed-paths.txt" ]; then
            prerender=true
          fi
          while IFS= read -r path; do
            case "$path" in
              README.md|AGENTS.md|docs/*|tests/*|.github/workflows/*|.github/dependabot.yml|scripts/assert-*.mjs|scripts/check-pages-build.mjs)
                # Post-build audit scripts do not affect generated site assets.
                # Unit tests still validate these audits without 4k-page prerender.
                ;;
              *)
                prerender=true
                ;;
            esac
          done < "$RUNNER_TEMP/pr-changed-paths.txt"

          echo "prerender=$prerender" >> "$GITHUB_OUTPUT"
          if [ "$prerender" = true ]; then
            echo "::notice::Application/build/data change: full Nuxt prerender and SEO audits required."
          else
            echo "::notice::CI/docs/tests-only change: unit tests required; expensive Nuxt prerender skipped."
          fi

      - name: "Setup Node.js"
        if: steps.current.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: "Install dependencies"
        if: steps.current.outputs.run == 'true'
        run: npm ci

      - name: "Run unit tests"
        if: steps.current.outputs.run == 'true'
        run: npm test

      # Cache small deterministic pregenerate assets, not thousands of HTML pages.
      - name: "Restore generated radio search index"
        id: search_cache
        if: steps.scope.outputs.prerender == 'true'
        uses: actions/cache@v6
        with:
          path: public/search/stations.json
          key: ${{ runner.os }}-onair-search-v1-${{ hashFiles('public/radio/**/*.json', 'utils/featured-stations.mjs', 'scripts/build-station-search-index.mjs') }}

      - name: "Restore generated social preview"
        id: social_cache
        if: steps.scope.outputs.prerender == 'true'
        uses: actions/cache@v6
        with:
          path: public/brand/social-preview.png
          key: ${{ runner.os }}-onair-social-v1-${{ hashFiles('public/brand/social-preview.svg', 'scripts/generate-social-preview.mjs', 'package-lock.json') }}

      - name: "Generate prerendered site"
        if: steps.scope.outputs.prerender == 'true'
        # CI uses the same two public variables as the real staging host.
        # A checkout/branch name must not change the generated SEO policy.
        env:
          NUXT_PUBLIC_SITE_URL: ${{ github.base_ref == 'develop' && 'https://new-radio.eplus.dev' || 'https://radio.eplus.dev' }}
          NUXT_PUBLIC_NO_INDEX: ${{ github.base_ref == 'develop' && 'true' || 'false' }}
          NUXT_APP_BASE_URL: /
          ONAIR_SKIP_STATION_OG: 'true'
          NUXT_PUBLIC_STATION_OG_BASE_URL: ${{ vars.STATION_OG_BASE_URL }}
          ONAIR_SEARCH_INDEX_CACHE_HIT: ${{ steps.search_cache.outputs.cache-hit }}
          ONAIR_SOCIAL_PREVIEW_CACHE_HIT: ${{ steps.social_cache.outputs.cache-hit }}
        run: npm run generate:site

      - name: "Validate Pages project subpath and static assets"
        if: steps.scope.outputs.prerender == 'true' && github.base_ref == 'develop'
        run: node scripts/assert-project-pages-output.mjs .output/public custom-domain

      - name: "Validate generated sitemap and staging indexability"
        if: steps.scope.outputs.prerender == 'true'
        env:
          NUXT_PUBLIC_SITE_URL: ${{ github.base_ref == 'develop' && 'https://new-radio.eplus.dev' || 'https://radio.eplus.dev' }}
          NUXT_PUBLIC_NO_INDEX: ${{ github.base_ref == 'develop' && 'true' || 'false' }}
        run: node scripts/assert-sitemap-xml.mjs

      - name: "Assert route-specific prerendered Open Graph metadata"
        if: steps.scope.outputs.prerender == 'true'
        env:
          SEO_EXPECTED_SITE_URL: ${{ github.base_ref == 'develop' && 'https://new-radio.eplus.dev' || 'https://radio.eplus.dev' }}
        run: node scripts/assert-route-social-meta.mjs

      # DEV uses the shared brand preview: it must not generate or audit
      # per-station social JPEGs, which exceed the Pages size budget.
      - name: "Audit all stations Open Graph HTML and JPEG images"
        if: steps.scope.outputs.prerender == 'true' && github.base_ref != 'develop'
        env:
          SEO_EXPECTED_SITE_URL: ${{ github.base_ref == 'develop' && 'https://new-radio.eplus.dev' || 'https://radio.eplus.dev' }}
        run: node scripts/assert-all-station-social-meta.mjs

      - name: "Verify ePlus OnAir logo, social image and favicons"
        if: steps.scope.outputs.prerender == 'true'
        run: node scripts/assert-brand-assets.mjs

      - name: "Audit output for GitHub Pages migration readiness"
        if: steps.scope.outputs.prerender == 'true'
        run: node scripts/check-pages-build.mjs .output/public "${{ github.base_ref == 'develop' && 'staging' || 'production' }}"

      - name: "Assert staging pages are noindex"
        if: github.base_ref == 'develop' && steps.scope.outputs.prerender == 'true'
        run: node scripts/assert-staging-noindex.mjs

      # Browser tests are temporarily opt-in at the owner's request.
      # Keep npm run test:ui available for focused follow-up checks.
      - name: "Install Chromium for UI regression tests"
        if: ${{ vars.ENABLE_BROWSER_TESTS == 'true' && steps.scope.outputs.prerender == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: "Verify persistent player and responsive UI"
        if: ${{ vars.ENABLE_BROWSER_TESTS == 'true' && steps.scope.outputs.prerender == 'true' }}
        run: npm run test:ui

