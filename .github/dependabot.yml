# Dependabot reads this file on the default branch (main).
# Security updates must remain on main; only routine VERSION updates target staging.
# Keep separate entries for each ecosystem so target-branch does not disable
# its security-update configuration.
version: 2
updates:
  # Default branch: security updates only (limit: 0 disables routine versions,
  # not Dependabot security alerts or their remediation PRs).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    groups:
      npm-security-nonbreaking:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Version updates are validated in staging before staging -> main promotion.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      npm-version-nonbreaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      actions-version-nonbreaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
